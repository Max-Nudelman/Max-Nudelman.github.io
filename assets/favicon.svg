<!-- MN monogram. Solid accent tile with dark letters rather than the reverse,
     because thin mint letters on a dark tile turn into a smudge at 16px, which
     is the size a browser tab actually renders. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="13" fill="#5EE6A8"/>
  <text x="32" y="44" text-anchor="middle" fill="#0B0D10"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="32" font-weight="700" letter-spacing="-1.5">MN</text>
</svg>
